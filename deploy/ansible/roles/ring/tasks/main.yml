---
- name: Add Helm repositories for the bootstrap ring
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url }}"
    force_update: true
  loop:
    - { name: kong, url: "https://charts.konghq.com" }
    - { name: external-secrets, url: "https://charts.external-secrets.io" }
    - { name: rancher-fleet, url: "https://rancher.github.io/fleet-helm-charts/" }

- name: Generate self-signed certificate for bitwarden-sdk-server
  block:
    - name: Create temp directory for cert generation
      ansible.builtin.tempfile:
        state: directory
        suffix: _bws_certs
      register: cert_tmpdir
      when: deploy_bitwarden_sdk | default(true)

    - name: Generate private key for bitwarden-sdk-server
      community.crypto.openssl_privatekey:
        path: "{{ cert_tmpdir.path }}/bws-server.key"
        type: RSA
        size: 2048
      when: deploy_bitwarden_sdk | default(true)

    - name: Generate CSR for bitwarden-sdk-server
      community.crypto.openssl_csr:
        path: "{{ cert_tmpdir.path }}/bws-server.csr"
        privatekey_path: "{{ cert_tmpdir.path }}/bws-server.key"
        common_name: "external-secrets-bitwarden-sdk-server.external-secrets.svc.cluster.local"
        subject_alt_name:
          - "DNS:external-secrets-bitwarden-sdk-server.external-secrets.svc.cluster.local"
          - "DNS:external-secrets-bitwarden-sdk-server.external-secrets.svc"
          - "DNS:external-secrets-bitwarden-sdk-server"
          - "DNS:bitwarden-sdk-server.external-secrets.svc.cluster.local"
          - "DNS:localhost"
      when: deploy_bitwarden_sdk | default(true)

    - name: Generate self-signed certificate for bitwarden-sdk-server
      community.crypto.x509_certificate:
        path: "{{ cert_tmpdir.path }}/bws-server.crt"
        csr_path: "{{ cert_tmpdir.path }}/bws-server.csr"
        privatekey_path: "{{ cert_tmpdir.path }}/bws-server.key"
        provider: selfsigned
        selfsigned_not_after: "+365d"
      when: deploy_bitwarden_sdk | default(true)

    - name: Read certificate and key for Secret
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: cert_key_content
      loop:
        - "{{ cert_tmpdir.path }}/bws-server.crt"
        - "{{ cert_tmpdir.path }}/bws-server.key"
      when: deploy_bitwarden_sdk | default(true)

    - name: Create Kubernetes Secret for bitwarden-sdk-server TLS
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: bitwarden-sdk-server-tls
            namespace: external-secrets
          type: kubernetes.io/tls
          data:
            tls.crt: "{{ cert_key_content.results[0].content }}"
            tls.key: "{{ cert_key_content.results[1].content }}"
        kubeconfig: "{{ kubeconfig_path }}"
      when: deploy_bitwarden_sdk | default(true)

    - name: Clean up temporary certificate files
      ansible.builtin.file:
        path: "{{ cert_tmpdir.path }}"
        state: absent
      when: deploy_bitwarden_sdk | default(true)

- name: Install External Secrets Operator with bitwarden-sdk-server subchart
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: external-secrets/external-secrets
    chart_version: "0.14.3"
    release_namespace: external-secrets
    create_namespace: true
    wait: true
    timeout: "300s"
    kubeconfig: "{{ kubeconfig_path }}"
    values:
      crds:
        enabled: true
      bitwarden-sdk-server:
        enabled: "{{ deploy_bitwarden_sdk | default(true) }}"
        service:
          type: ClusterIP
          port: 5000
        tls:
          enabled: "{{ deploy_bitwarden_sdk | default(true) }}"
          secretName: bitwarden-sdk-server-tls

- name: Remove stale Rancher admission webhooks before the Kong install
  kubernetes.core.k8s:
    state: absent
    api_version: admissionregistration.k8s.io/v1
    kind: "{{ item }}"
    name: rancher.cattle.io
    kubeconfig: "{{ kubeconfig_path }}"
  loop:
    - ValidatingWebhookConfiguration
    - MutatingWebhookConfiguration
  failed_when: false

- name: Install Kong ingress controller
  kubernetes.core.helm:
    name: kong
    chart_ref: kong/kong
    chart_version: "3.4.1"
    release_namespace: kong
    create_namespace: true
    wait: false
    timeout: "600s"
    kubeconfig: "{{ kubeconfig_path }}"
    values:
      ingressController:
        enabled: true
      admin:
        enabled: true
      proxy:
        type: LoadBalancer
        http:
          enabled: false
        tls:
          nodePort: 30443
          servicePort: 8443
      env:
        database: "off"
      image:
        tag: "3.7"

- name: Wait for Kong to be ready (non-fatal)
  ansible.builtin.command: >
    kubectl -n kong wait --for=condition=ready pod
    --selector=app.kubernetes.io/name=kong --timeout=600s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

- name: Install Fleet CRD helm release
  kubernetes.core.helm:
    name: fleet-crd
    chart_ref: rancher-fleet/fleet-crd
    chart_version: "0.9.1"
    release_namespace: fleet-system
    create_namespace: true
    wait: true
    timeout: "300s"
    kubeconfig: "{{ kubeconfig_path }}"

- name: Install Fleet helm release
  kubernetes.core.helm:
    name: fleet
    chart_ref: rancher-fleet/fleet
    chart_version: "0.9.1"
    release_namespace: fleet-system
    create_namespace: true
    wait: true
    timeout: "600s"
    kubeconfig: "{{ kubeconfig_path }}"
    values:
      gitDriver: "default"
      agentEnvVars:
        - name: FLEET_AGENT_NAMESPACE
          value: fleet-system
