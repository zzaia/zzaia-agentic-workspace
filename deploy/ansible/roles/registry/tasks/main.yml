---
- name: Check for existing local registry container
  ansible.builtin.command: docker ps -aq -f name=^zzaia-registry$
  register: zzaia_registry_existing
  changed_when: false
  become: true

- name: Run the local OCI registry (registry:2) on loopback 5000
  ansible.builtin.command:
    cmd: docker run -d --name zzaia-registry --restart always -p 127.0.0.1:5000:5000 registry:2
  when: zzaia_registry_existing.stdout | length == 0
  become: true

- name: Ensure the local OCI registry is started
  ansible.builtin.command: docker start zzaia-registry
  when: zzaia_registry_existing.stdout | length > 0
  changed_when: false
  become: true
