---
- name: Install base apt packages
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - openssl
      - jq
      - git
      - ca-certificates
      - python3-pip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Docker via the official convenience script
  become: true
  block:
    - name: Download the Docker install script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: "0755"
    - name: Run the Docker install script
      ansible.builtin.command: sh /tmp/get-docker.sh
      args:
        creates: /usr/bin/docker
    - name: Ensure Docker is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

- name: Add the invoking user to the docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true

- name: Install the kubectl binary
  become: true
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Install Helm
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm
    executable: /bin/bash

- name: Install the Python Kubernetes client (required by kubernetes.core)
  become: true
  ansible.builtin.pip:
    name:
      - kubernetes>=24.2.0
    state: present
    extra_args: --break-system-packages --ignore-installed
