{{- if .Values.portainer.enabled }}
{{- /*
=============================================================================
portainer-server (KEPT, locked decision 2).

REMOTE DOCKER ENDPOINT (no host socket)
  In compose Portainer talked to dind over tcp://dind-server:2375 rather than a
  bound /var/run/docker.sock, and the image entrypoint self-registers that
  endpoint through the Portainer API on first boot (EndpointCreationType=1,
  URL=tcp://dind-server:2375). In-cluster the dind Service is named dind-server
  too, so that hardcoded URL resolves unchanged — no host socket is mounted and
  none is needed. DOCKER_HOST is also passed for any CLI tooling in the image.
  This pod carries zzaia.com/dind-client:"true" so the dind NetworkPolicy admits
  it. See portainer-server/entrypoint.sh for the registration flow.

ADMIN PASSWORD
  The entrypoint reads /run/secrets/admin_password and runs Portainer with
  --admin-password-file. That path is materialised from the ESO secret key
  ADMIN_PASSWORD, projected to the filename admin_password.
=============================================================================
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.portainer.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zzaia-workspace.componentLabels" (dict "root" . "component" .Values.portainer.name) | nindent 4 }}
spec:
  replicas: {{ .Values.portainer.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "zzaia-workspace.componentSelectorLabels" (dict "root" . "component" .Values.portainer.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zzaia-workspace.componentSelectorLabels" (dict "root" . "component" .Values.portainer.name) | nindent 8 }}
        zzaia.com/dind-client: "true"
    spec:
      {{- include "zzaia-workspace.scheduling" . | nindent 6 }}
      {{- with (include "zzaia-workspace.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "zzaia-workspace.podSecurityContext" (dict "ctx" .Values.portainer.securityContext) | nindent 8 }}
      containers:
        - name: {{ .Values.portainer.name }}
          image: {{ include "zzaia-workspace.image" (dict "root" . "image" .Values.images.portainer) | quote }}
          imagePullPolicy: {{ include "zzaia-workspace.imagePullPolicy" (dict "root" . "image" .Values.images.portainer) }}
          securityContext:
            {{- include "zzaia-workspace.containerSecurityContext" (dict "ctx" .Values.portainer.securityContext) | nindent 12 }}
          env:
            - name: DOCKER_HOST
              value: {{ include "zzaia-workspace.dockerHost" . | quote }}
            - name: KIND_ENABLED
              value: {{ .Values.dind.env.kindEnabled | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.portainer.ports.http }}
            - name: edge
              containerPort: {{ .Values.portainer.ports.edge }}
            - name: https
              containerPort: {{ .Values.portainer.ports.https }}
          resources:
            requests:
              {{- toYaml .Values.portainer.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.portainer.resources.limits | nindent 14 }}
          livenessProbe:
            {{- include "zzaia-workspace.probe" (dict "kind" "http" "port" .Values.portainer.ports.http "path" .Values.portainer.probes.httpPath "cfg" .Values.portainer.probes.liveness) | nindent 12 }}
          readinessProbe:
            {{- include "zzaia-workspace.probe" (dict "kind" "http" "port" .Values.portainer.ports.http "path" .Values.portainer.probes.httpPath "cfg" .Values.portainer.probes.readiness) | nindent 12 }}
          startupProbe:
            {{- include "zzaia-workspace.probe" (dict "kind" "http" "port" .Values.portainer.ports.http "path" .Values.portainer.probes.httpPath "cfg" .Values.portainer.probes.startup) | nindent 12 }}
          volumeMounts:
            - name: portainer-data
              mountPath: {{ .Values.volumes.portainerData.mountPath }}
            - name: admin-password
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: portainer-data
          persistentVolumeClaim:
            claimName: {{ include "zzaia-workspace.pvcName" (dict "root" . "volume" "portainerData") }}
        - name: admin-password
          secret:
            secretName: {{ include "zzaia-workspace.groupSecretName" (dict "root" . "group" "admin") }}
            optional: true
            defaultMode: 0400
            items:
              - key: ADMIN_PASSWORD
                path: admin_password
{{- end }}
