{{- if .Values.observability.enabled }}
{{- /*
Shared OTEL wiring consumed by every workload via `envFrom`. Points at the OTLP
collector in the shared infra namespace (FQDN built by the otlpEndpoint helper),
which fixes the previously-broken cluster OTLP ingestion path.

Per-pod OTEL_SERVICE_NAME is set on each workload (env wins over envFrom), so it
is intentionally NOT in this ConfigMap — everything here is identical across the
release. Consume with:
  envFrom:
    - configMapRef:
        name: {{ .Release.Name }}-observability
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-observability
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zzaia-workspace.componentLabels" (dict "root" . "component" "observability") | nindent 4 }}
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ include "zzaia-workspace.otlpEndpoint" . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.observability.otlpProtocol | quote }}
  OTEL_TRACES_EXPORTER: {{ .Values.observability.tracesExporter | quote }}
  OTEL_METRICS_EXPORTER: {{ .Values.observability.metricsExporter | quote }}
  OTEL_LOGS_EXPORTER: {{ .Values.observability.logsExporter | quote }}
  OTEL_RESOURCE_ATTRIBUTES: {{ printf "service.namespace=%s,deployment.environment=%s" .Values.observability.serviceNamespace .Release.Namespace | quote }}
{{- end }}
