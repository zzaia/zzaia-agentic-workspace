{{- if .Values.qdrant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.qdrant.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zzaia-workspace.componentLabels" (dict "root" . "component" .Values.qdrant.name) | nindent 4 }}
spec:
  type: {{ .Values.qdrant.service.type }}
  selector:
    {{- include "zzaia-workspace.componentSelectorLabels" (dict "root" . "component" .Values.qdrant.name) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.qdrant.ports.http }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.qdrant.ports.grpc }}
      targetPort: grpc
      protocol: TCP
{{- end }}
