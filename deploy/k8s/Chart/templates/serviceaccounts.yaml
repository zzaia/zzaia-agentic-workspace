{{- if and .Values.externalSecrets.enabled (eq .Values.externalSecrets.provider "azurekv") }}
{{- /*
Namespace-local `external-secrets` ServiceAccount, annotated for Azure Workload
Identity (mirrors the azurekv branch of the infra chart's
external-secrets-store.yaml). The cluster ClusterSecretStore authenticates
through the SA named in its own serviceAccountRef (in the infra namespace), so
this SA is not strictly required for the shared store to work; it is created for
parity and so that federated-token auth resolves cleanly if an operator ever
points a store at this namespace. Harmless duplicate — ServiceAccounts are
namespaced, so this never collides with the infra chart's SA of the same name.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecrets.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zzaia-workspace.componentLabels" (dict "root" . "component" "external-secrets") | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.externalSecrets.azurekv.clientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.externalSecrets.azurekv.tenantId | quote }}
{{- end }}
