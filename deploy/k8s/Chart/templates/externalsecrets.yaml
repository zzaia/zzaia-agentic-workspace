{{- if .Values.externalSecrets.enabled }}
{{- /*
Materialise the workspace credentials from Azure Key Vault into THIS namespace
via the EXISTING cluster ClusterSecretStore. The store is owned by the infra
chart (external-secrets-store.yaml, azurekv/WorkloadIdentity branch) and carries
no spec.conditions, so it is usable from any namespace — we reference it, never
recreate it (externalSecrets.createClusterSecretStore=false).

ONE ExternalSecret + Secret PAIR PER GROUP, not one monolithic Secret.
Originally this rendered a single Secret carrying all 23 keys, envFrom'd whole
into every credential-consuming workload — vscode/jupyter/tunnel-sidecar,
git-sidecar, bifrost, workspace-server, and 7 MCP servers all received every
other consumer's credentials regardless of need. Each group below corresponds
to exactly one Key Vault JSON-blob object (.Values.externalSecrets.groupNames),
and zzaia-workspace.credentialsEnvFrom lets each consumer request only the
group(s) its entrypoint actually reads (verified against each container's
entrypoint.sh under docker/containers/) via zzaia-workspace.groupSecretName.

remoteRef.key = the Key Vault object name (== the group); remoteRef.property =
the field inside that object's JSON blob. Both come verbatim from
.Values.externalSecrets.data, which mirrors the property names the container
entrypoints read.

Deliberately NOT a helm hook: unlike the infra store (which had to sequence
after its own ClusterSecretStore), these ExternalSecrets must be normally
reconciled resources so ESO keeps each Secret refreshed on refreshInterval.
*/}}
{{- $root := . }}
{{- range .Values.externalSecrets.groupNames }}
{{- $group := . }}
{{- $items := list }}
{{- range $root.Values.externalSecrets.data }}
{{- if eq .remoteKey $group }}
{{- $items = append $items . }}
{{- end }}
{{- end }}
{{- if $items }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "zzaia-workspace.groupSecretName" (dict "root" $root "group" $group) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "zzaia-workspace.componentLabels" (dict "root" $root "component" "external-secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $root.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $root.Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "zzaia-workspace.groupSecretName" (dict "root" $root "group" $group) }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $items }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey | quote }}
        property: {{ .property | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
