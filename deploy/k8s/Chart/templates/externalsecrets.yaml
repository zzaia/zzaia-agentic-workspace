{{- if .Values.externalSecrets.enabled }}
{{- /*
Materialise the workspace credentials from Bitwarden Secrets Manager into THIS namespace
via the cluster ClusterSecretStore. The store is created by THIS chart
(templates/clustersecretstore.yaml) if externalSecrets.createClusterSecretStore=true.

ONE ExternalSecret + Secret PAIR PER GROUP, not one monolithic Secret.
Each group corresponds to one logical credential group (.Values.externalSecrets.groupNames),
and zzaia-workspace.credentialsEnvFrom lets each consumer request only the group(s)
its entrypoint actually reads (verified against each container's entrypoint.sh under
docker/containers/) via zzaia-workspace.groupSecretName.

Bitwarden Secrets Manager model (flat, no property field):
remoteRef.key = the BWS secret name/ID (== the secret identifier in Bitwarden).
Both come verbatim from .Values.externalSecrets.data, which mirrors the property
names the container entrypoints read.

Deliberately NOT a helm hook: ExternalSecrets must be normally reconciled
resources so ESO keeps each Secret refreshed on refreshInterval.
*/}}
{{- $root := . }}
{{- range .Values.externalSecrets.groupNames }}
{{- $group := . }}
{{- $items := list }}
{{- range $root.Values.externalSecrets.data }}
{{- if eq .remoteKey $group }}
{{- $items = append $items . }}
{{- end }}
{{- end }}
{{- if $items }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "zzaia-workspace.groupSecretName" (dict "root" $root "group" $group) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "zzaia-workspace.componentLabels" (dict "root" $root "component" "external-secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $root.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $root.Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "zzaia-workspace.groupSecretName" (dict "root" $root "group" $group) }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $items }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .secretName | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
