{{- if not .Values.externalSecrets.enabled }}
# WARNING: Sensitive values. DEV/VALIDATION ONLY.
# When externalSecrets.enabled=true, Secrets are managed by External Secrets Operator.
# Real secrets come from Bitwarden via ESO when enabled.
#
# This fallback Secret renders when externalSecrets.enabled=false, allowing the
# cluster to validate end-to-end WITHOUT a BWS token. Each group renders as one Secret,
# matching the name that the ExternalSecret would create (zzaia-workspace-secrets-<group>),
# so all pod envFrom references continue to work identically in both modes.
{{- $root := . }}
{{- $secrets := default dict $root.Values.secrets }}
{{- range .Values.externalSecrets.groupNames }}
{{- $group := . }}
{{- $items := list }}
{{- range $root.Values.externalSecrets.data }}
{{- if eq .remoteKey $group }}
{{- $items = append $items . }}
{{- end }}
{{- end }}
{{- if $items }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zzaia-workspace.groupSecretName" (dict "root" $root "group" $group) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "zzaia-workspace.componentLabels" (dict "root" $root "component" "fallback-secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- range $items }}
  {{ .secretKey }}: {{ index $secrets .secretKey | default "localdev" | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
