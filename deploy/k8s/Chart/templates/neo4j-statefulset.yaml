{{- if .Values.neo4j.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.neo4j.name }}
  labels:
    {{- include "zzaia-workspace.componentLabels" (dict "root" . "component" .Values.neo4j.name) | nindent 4 }}
spec:
  replicas: {{ .Values.neo4j.replicas }}
  serviceName: {{ .Values.neo4j.name }}
  selector:
    matchLabels:
      {{- include "zzaia-workspace.componentSelectorLabels" (dict "root" . "component" .Values.neo4j.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zzaia-workspace.componentSelectorLabels" (dict "root" . "component" .Values.neo4j.name) | nindent 8 }}
    spec:
      {{- include "zzaia-workspace.scheduling" . | nindent 6 }}
      {{- with (include "zzaia-workspace.imagePullSecrets" .) }}
      {{ . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "zzaia-workspace.podSecurityContext" (dict "ctx" .Values.neo4j.securityContext) | nindent 8 }}
      {{- if .Values.neo4j.fixPermissions.enabled }}
      initContainers:
        {{- include "zzaia-workspace.fixPermissions" (dict "root" . "volumeName" "database-neo4j" "mountPath" .Values.volumes.databaseNeo4j.mountPath "ctx" .Values.neo4j.securityContext) | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.neo4j.name }}
          image: {{ include "zzaia-workspace.image" (dict "root" . "image" .Values.images.databaseNeo4j) | quote }}
          imagePullPolicy: {{ include "zzaia-workspace.imagePullPolicy" (dict "root" . "image" .Values.images.databaseNeo4j) }}
          ports:
            - name: http
              containerPort: {{ .Values.neo4j.ports.http }}
            - name: bolt
              containerPort: {{ .Values.neo4j.ports.bolt }}
          env:
            - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              value: {{ .Values.neo4j.env.acceptLicenseAgreement | quote }}
            # Password sourced from the ESO-materialised credentials Secret and
            # interpolated into NEO4J_AUTH via the k8s $(VAR) reference form.
            # NOTE: Intermediate env var name MUST NOT start with NEO4J_ to avoid
            # neo4j treating it as a config setting (which fails strict validation).
            - name: GRAPHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zzaia-workspace.groupSecretName" (dict "root" . "group" "admin") }}
                  key: {{ .Values.neo4j.auth.passwordSecretKey }}
            - name: NEO4J_AUTH
              value: {{ printf "%s/$(GRAPHDB_PASSWORD)" .Values.neo4j.env.username | quote }}
            - name: NEO4J_server_memory_heap_initial__size
              value: {{ .Values.neo4j.env.heapInitialSize | quote }}
            - name: NEO4J_server_memory_heap_max__size
              value: {{ .Values.neo4j.env.heapMaxSize | quote }}
            - name: NEO4J_server_memory_pagecache_size
              value: {{ .Values.neo4j.env.pagecacheSize | quote }}
          securityContext:
            {{- include "zzaia-workspace.containerSecurityContext" (dict "ctx" .Values.neo4j.securityContext) | nindent 12 }}
          resources:
            {{- toYaml .Values.neo4j.resources | nindent 12 }}
          livenessProbe:
            {{- include "zzaia-workspace.probe" (dict "kind" "http" "port" .Values.neo4j.ports.http "path" .Values.neo4j.probes.httpPath "cfg" .Values.neo4j.probes.liveness) | nindent 12 }}
          readinessProbe:
            {{- include "zzaia-workspace.probe" (dict "kind" "http" "port" .Values.neo4j.ports.http "path" .Values.neo4j.probes.httpPath "cfg" .Values.neo4j.probes.readiness) | nindent 12 }}
          startupProbe:
            {{- include "zzaia-workspace.probe" (dict "kind" "tcp" "port" .Values.neo4j.ports.bolt "cfg" .Values.neo4j.probes.startup) | nindent 12 }}
          volumeMounts:
            - name: database-neo4j
              mountPath: {{ .Values.volumes.databaseNeo4j.mountPath }}
            {{- if .Values.neo4j.tmpfs.logs.enabled }}
            - name: logs
              mountPath: /logs
            {{- end }}
      volumes:
        - name: database-neo4j
          persistentVolumeClaim:
            claimName: {{ include "zzaia-workspace.pvcName" (dict "root" . "volume" "databaseNeo4j") }}
        {{- if .Values.neo4j.tmpfs.logs.enabled }}
        - name: logs
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.neo4j.tmpfs.logs.sizeLimit }}
        {{- end }}
{{- end }}
