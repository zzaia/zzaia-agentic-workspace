defaultNamespace: zzaia-agentic-workspace

helm:
  releaseName: zzaia-workspace
  chart: "."
  valuesFiles:
    - values.yaml

targetCustomizations:
  - name: local
    clusterSelector:
      matchLabels:
        env: local
    helm:
      valuesFiles:
        - values.yaml
      values:
        storageClass: local-path
        images:
          registry: "localhost:5000"
          pullSecret: ""
        gpu:
          enabled: false
        # Local dev uses Bitwarden Secrets Manager for credentials.
        externalSecrets:
          enabled: true
          provider: "bitwardensecretsmanager"
          createClusterSecretStore: true
        tunnelSidecar:
          enabled: false

  - name: production
    clusterSelector:
      matchLabels:
        env: production
    helm:
      valuesFiles:
        - values.yaml
        - values-production.yaml
      values:
        externalSecrets:
          bitwardensecretsmanager:
            organizationId: ""
