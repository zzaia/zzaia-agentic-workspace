---
# Node.js and npm global installation via nvm

- meta: end_role
  when: not (node_enabled | bool)

- name: Create NVM directory
  ansible.builtin.file:
    path: "{{ install_prefix }}/.nvm"
    owner: user
    group: user
    mode: "0755"
    state: directory

- name: Ensure .local/bin directory exists
  ansible.builtin.file:
    path: "{{ install_prefix }}/.local/bin"
    owner: user
    group: user
    mode: "0755"
    state: directory

- name: Check if NVM is installed
  ansible.builtin.stat:
    path: "{{ install_prefix }}/.nvm/nvm.sh"
  register: nvm_stat

- name: Check NVM version marker
  ansible.builtin.stat:
    path: "{{ install_prefix }}/.nvm/.nvm_version"
  register: nvm_version_marker

- name: Read NVM version marker
  ansible.builtin.slurp:
    src: "{{ install_prefix }}/.nvm/.nvm_version"
  register: nvm_version_content
  when: nvm_version_marker.stat.exists

- name: Determine if NVM needs (re)install
  ansible.builtin.set_fact:
    nvm_needs_install: >-
      {{ not nvm_stat.stat.exists or not nvm_version_marker.stat.exists or
         (nvm_version_content.content | b64decode | trim) != nvm_version }}

- name: Install NVM
  ansible.builtin.shell: |
    curl -o- "https://raw.githubusercontent.com/nvm-sh/nvm/v{{ nvm_version }}/install.sh" | bash
  args:
    executable: /bin/bash
  environment:
    NVM_DIR: "{{ install_prefix }}/.nvm"
    GIT_CONFIG_GLOBAL: /dev/null
  when: nvm_needs_install
  changed_when: false

- name: Write NVM version marker
  ansible.builtin.copy:
    content: "{{ nvm_version }}"
    dest: "{{ install_prefix }}/.nvm/.nvm_version"
  when: nvm_needs_install

- name: Install Node.js
  ansible.builtin.shell: |
    export NVM_DIR="{{ install_prefix }}/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

    if ! nvm ls "{{ node_version }}" 2>/dev/null | grep -q "v{{ node_version }}"; then
        nvm install "{{ node_version }}"
        nvm alias default "{{ node_version }}"
    fi
  args:
    executable: /bin/bash
  environment:
    NVM_DIR: "{{ install_prefix }}/.nvm"
  changed_when: false

- name: Create node/npm symlinks in .local/bin
  block:
    - name: Find latest Node.js installation
      ansible.builtin.find:
        path: "{{ install_prefix }}/.nvm/versions/node"
        patterns: "v*"
        file_type: directory
      register: node_dirs

    - name: Set node directory
      ansible.builtin.set_fact:
        node_dir: "{{ node_dirs.files | sort(attribute='path', reverse=True) | first }}"
      when: node_dirs.files | length > 0

    - name: Wait for node binary to be fully extracted
      ansible.builtin.wait_for:
        path: "{{ node_dir.path }}/bin/node"
        state: present
        timeout: 30
      when: node_dir is defined

    - name: Create symlinks
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: user
        group: user
        state: link
        force: yes
      loop:
        - { src: "{{ node_dir.path }}/bin/node", dest: "{{ install_prefix }}/.local/bin/node" }
        - { src: "{{ node_dir.path }}/bin/npm", dest: "{{ install_prefix }}/.local/bin/npm" }
      when: node_dir is defined

- name: Clean partial Puppeteer cache to prevent install failures
  ansible.builtin.file:
    path: /home/user/.cache/puppeteer
    state: absent
  become: yes
  become_user: user
  changed_when: false

- name: Install npm global packages
  block:
    - name: Create npm global directory
      ansible.builtin.file:
        path: "{{ install_prefix }}/.npm-global"
        owner: user
        group: user
        mode: "0755"
        state: directory

    - name: Pin npm default global prefix to .npm-global
      ansible.builtin.copy:
        content: "prefix={{ install_prefix }}/.npm-global\n"
        dest: /home/user/.npmrc
        owner: user
        group: user
        mode: "0644"

    - name: Install Claude Code
      ansible.builtin.shell: |
        export NVM_DIR="{{ install_prefix }}/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        npm install -g --prefix "{{ install_prefix }}/.npm-global" "@anthropic-ai/claude-code@{{ claude_code_version }}"
      args:
        executable: /bin/bash
        creates: "{{ install_prefix }}/.npm-global/bin/claude"
      environment:
        NVM_DIR: "{{ install_prefix }}/.nvm"
        PUPPETEER_SKIP_DOWNLOAD: "1"
      changed_when: false

    - name: Install mermaid CLI
      ansible.builtin.shell: |
        export NVM_DIR="{{ install_prefix }}/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        npm install -g --prefix "{{ install_prefix }}/.npm-global" "@mermaid-js/mermaid-cli@{{ mmdc_version }}"
      args:
        executable: /bin/bash
        creates: "{{ install_prefix }}/.npm-global/bin/mmdc"
      environment:
        NVM_DIR: "{{ install_prefix }}/.nvm"
        PUPPETEER_SKIP_DOWNLOAD: "1"
      changed_when: false

    - name: Install Codex
      when: codex_enabled | bool
      ansible.builtin.shell: |
        export NVM_DIR="{{ install_prefix }}/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        npm install -g --prefix "{{ install_prefix }}/.npm-global" "@openai/codex@{{ codex_version }}"
      args:
        executable: /bin/bash
        creates: "{{ install_prefix }}/.npm-global/bin/codex"
      environment:
        NVM_DIR: "{{ install_prefix }}/.nvm"
        PUPPETEER_SKIP_DOWNLOAD: "1"
      changed_when: false

    - name: Install Gemini CLI
      when: gemini_enabled | bool
      ansible.builtin.shell: |
        export NVM_DIR="{{ install_prefix }}/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        npm install -g --prefix "{{ install_prefix }}/.npm-global" "@google/gemini-cli@{{ gemini_cli_version }}"
      args:
        executable: /bin/bash
        creates: "{{ install_prefix }}/.npm-global/bin/gemini"
      environment:
        NVM_DIR: "{{ install_prefix }}/.nvm"
        PUPPETEER_SKIP_DOWNLOAD: "1"
      changed_when: false

    - name: Install OpenCode
      when: opencode_enabled | bool
      ansible.builtin.shell: |
        export NVM_DIR="{{ install_prefix }}/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        npm install -g --prefix "{{ install_prefix }}/.npm-global" "opencode-ai@{{ opencode_version }}"
      args:
        executable: /bin/bash
        creates: "{{ install_prefix }}/.npm-global/bin/opencode"
      environment:
        NVM_DIR: "{{ install_prefix }}/.nvm"
        PUPPETEER_SKIP_DOWNLOAD: "1"
      changed_when: false

    - name: Install GitHub Copilot CLI
      when: copilot_enabled | bool
      ansible.builtin.shell: |
        export NVM_DIR="{{ install_prefix }}/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        npm install -g --prefix "{{ install_prefix }}/.npm-global" "@github/copilot@{{ copilot_version }}"
      args:
        executable: /bin/bash
        creates: "{{ install_prefix }}/.npm-global/bin/copilot"
      environment:
        NVM_DIR: "{{ install_prefix }}/.nvm"
        PUPPETEER_SKIP_DOWNLOAD: "1"
      changed_when: false
