---
# Swift installation

- meta: end_role
  when: not (swift_enabled | bool)

- name: Check if swift is installed
  ansible.builtin.stat:
    path: "{{ install_prefix }}/swift/usr/bin/swift"
  register: swift_stat

- name: Check swift version marker
  ansible.builtin.stat:
    path: "{{ install_prefix }}/swift/.swift_version"
  register: swift_version_marker

- name: Read swift version marker
  ansible.builtin.slurp:
    src: "{{ install_prefix }}/swift/.swift_version"
  register: swift_version_content
  when: swift_version_marker.stat.exists

- name: Determine if swift needs (re)install
  ansible.builtin.set_fact:
    swift_needs_install: >-
      {{ not swift_stat.stat.exists or not swift_version_marker.stat.exists or
         (swift_version_content.content | b64decode | trim) != swift_version }}

- name: Download and install Swift
  ansible.builtin.shell: |
    cd /tmp
    curl -L "https://download.swift.org/swift-{{ swift_version }}-release/ubuntu2404/swift-{{ swift_version }}-RELEASE/swift-{{ swift_version }}-RELEASE-ubuntu24.04.tar.gz" \
      -o swift.tar.gz
    tar -xzf swift.tar.gz
    rm -rf {{ install_prefix }}/swift
    mv swift-{{ swift_version }}-RELEASE-ubuntu24.04 {{ install_prefix }}/swift
    rm swift.tar.gz
  args:
    executable: /bin/bash
  environment:
    HOME: /home/user
  when: swift_needs_install
  changed_when: false

- name: Write swift version marker
  ansible.builtin.copy:
    content: "{{ swift_version }}"
    dest: "{{ install_prefix }}/swift/.swift_version"
  when: swift_needs_install
