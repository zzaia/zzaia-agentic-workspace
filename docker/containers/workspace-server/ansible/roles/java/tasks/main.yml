---
# Java (Temurin JDK) installation
# Uses Adoptium's direct binary API instead of their apt repository — the apt repo's
# S3/Artifactory backend has documented throughput and reliability issues
# (adoptium/adoptium-support#452, #1285), matching the same curl-and-extract pattern
# already used by the dotnet role.

- meta: end_role
  when: not (java_enabled | bool)

- name: Create java directory
  ansible.builtin.file:
    path: "{{ install_prefix }}/java"
    owner: user
    group: user
    mode: "0755"
    state: directory

- name: Check if Temurin JDK is installed
  ansible.builtin.stat:
    path: "{{ install_prefix }}/java/bin/java"
  register: java_stat

- name: Check Temurin JDK version marker
  ansible.builtin.stat:
    path: "{{ install_prefix }}/java/.java_version"
  register: java_version_marker

- name: Read Temurin JDK version marker
  ansible.builtin.slurp:
    src: "{{ install_prefix }}/java/.java_version"
  register: java_version_content
  when: java_version_marker.stat.exists

- name: Determine if Temurin JDK needs (re)install
  ansible.builtin.set_fact:
    java_needs_install: >-
      {{ not java_stat.stat.exists or not java_version_marker.stat.exists or
         (java_version_content.content | b64decode | trim) != (java_version | string) }}

- name: Download and install Temurin JDK
  ansible.builtin.shell: |
    set -euo pipefail
    # The /v3/binary/latest/.../eclipse endpoint has no working .sha256.txt sidecar
    # (consistently 404s) — the assets API returns the download link and checksum
    # together in one JSON response instead.
    assets_url="https://api.adoptium.net/v3/assets/latest/{{ java_version }}/hotspot?image_type=jdk&os=linux&architecture=x64&vendor=eclipse"

    fetch_with_retry() {
      local url="$1" out="$2"
      local attempt=1 max=5 delay=5
      while [ "$attempt" -le "$max" ]; do
        if curl -fsSL "$url" -o "$out"; then
          return 0
        fi
        echo "WARN: fetch of $url attempt $attempt/$max failed; retrying in ${delay}s..." >&2
        attempt=$((attempt + 1))
        sleep "$delay"
        delay=$((delay * 2))
      done
      echo "ERROR: fetch of $url failed after $max attempts" >&2
      return 1
    }

    assets_json_file=$(mktemp)
    tmp_tar=$(mktemp)
    trap 'rm -f "$assets_json_file" "$tmp_tar"' EXIT

    fetch_with_retry "$assets_url" "$assets_json_file"

    download_url=$(python3 -c "import json; print(json.load(open('$assets_json_file'))[0]['binary']['package']['link'])")
    expected_sha=$(python3 -c "import json; print(json.load(open('$assets_json_file'))[0]['binary']['package']['checksum'])")

    fetch_with_retry "$download_url" "$tmp_tar"

    actual_sha=$(sha256sum "$tmp_tar" | awk '{print $1}')
    if [ -z "$expected_sha" ] || [ "$expected_sha" != "$actual_sha" ]; then
      echo "Checksum mismatch for Temurin JDK download (expected $expected_sha, got $actual_sha)" >&2
      exit 1
    fi

    rm -rf "{{ install_prefix }}/java"
    mkdir -p "{{ install_prefix }}/java"
    tar -xzf "$tmp_tar" -C "{{ install_prefix }}/java" --strip-components 1
  args:
    executable: /bin/bash
  when: java_needs_install
  changed_when: false

- name: Fix Temurin JDK ownership
  ansible.builtin.file:
    path: "{{ install_prefix }}/java"
    owner: user
    group: user
    recurse: yes
  when: java_needs_install

- name: Write Temurin JDK version marker
  ansible.builtin.copy:
    content: "{{ java_version }}"
    dest: "{{ install_prefix }}/java/.java_version"
    owner: user
    group: user
  when: java_needs_install
